version: 1
customRules:
  - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
    target: /index.html
    status: '200'
backend:
  phases:
    build:
      commands:
        - npm install --legacy-peer-deps
        - mkdir -p amplify/layers/ffmpeg-bin/bin
        - curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
        - python3 -c "import tarfile; tarfile.open('/tmp/ffmpeg.tar.xz').extractall('/tmp/')"
        - cp /tmp/ffmpeg-*-amd64-static/ffmpeg amplify/layers/ffmpeg-bin/bin/ffmpeg
        - chmod +x amplify/layers/ffmpeg-bin/bin/ffmpeg
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
